<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>لا يوجد اتصال — DirectHub</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1a56db;
      --primary-light: #e8f0fe;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f9fafb;
      --card: #ffffff;
      --nav-height: 64px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Layout ── */
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--nav-height));
      padding: 2rem 1.5rem;
      text-align: center;
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
    }
    .logo-img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: contain;
    }
    .logo-text {
      font-size: 1.375rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    /* ── Illustration ── */
    .illustration {
      width: 120px;
      height: 120px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .illustration svg {
      width: 60px;
      height: 60px;
      color: var(--primary);
    }

    /* ── Text ── */
    .title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    .subtitle {
      font-size: 0.9375rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 320px;
      margin-bottom: 2rem;
    }

    /* ── Status badge ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      font-size: 0.8125rem;
      font-weight: 600;
      margin-bottom: 2rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* ── Retry button ── */
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
      max-width: 280px;
      justify-content: center;
    }
    .btn-retry:hover { background: #1648c0; }
    .btn-retry:active { transform: scale(0.97); }
    .btn-retry.loading { opacity: 0.7; pointer-events: none; }
    .btn-retry svg { width: 18px; height: 18px; }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      padding-bottom: env(safe-area-inset-bottom, 0);
      z-index: 50;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      color: var(--muted);
      padding: 8px 4px 4px;
      font-size: 10px;
      font-weight: 600;
      transition: color 0.1s;
      position: relative;
    }
    .nav-item:hover { color: var(--primary); }
    .nav-item.active { color: var(--primary); }
    .nav-item.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 2px;
      background: var(--primary);
      border-radius: 0 0 4px 4px;
    }
    .nav-item svg { width: 22px; height: 22px; }
  </style>
</head>
<body>

  <div class="page">
    <!-- Logo -->
    <div class="logo-wrap">
      <img src="/assets/images/app_logo.png" alt="DirectHub" class="logo-img" onerror="this.style.display='none'" />
      <span class="logo-text">DirectHub</span>
    </div>

    <!-- Illustration: No WiFi -->
    <div class="illustration">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="currentColor"/>
      </svg>
    </div>

    <!-- Status -->
    <div class="status-badge">
      <span class="status-dot"></span>
      لا يوجد اتصال بالإنترنت
    </div>

    <!-- Title & Message -->
    <h1 class="title">أنت غير متصل بالإنترنت</h1>
    <p class="subtitle">
      يبدو أن الاتصال بالإنترنت منقطع حالياً.<br/>
      تحقق من إعدادات الشبكة أو الواي فاي، ثم اضغط على "إعادة المحاولة".
    </p>

    <!-- Retry Button -->
    <button class="btn-retry" id="retryBtn" onclick="retryConnection()">
      <svg id="retryIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
      </svg>
      إعادة المحاولة
    </button>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav" role="navigation" aria-label="التنقل السفلي" dir="rtl">

    <!-- Home -->
    <a href="/" class="nav-item active" aria-label="الرئيسية">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      الرئيسية
    </a>

    <!-- Categories -->
    <a href="/categories" class="nav-item" aria-label="الفئات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      الفئات
    </a>

    <!-- Messages -->
    <a href="/chat" class="nav-item" aria-label="رسائل">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      رسائل
    </a>

    <!-- Cart -->
    <a href="/cart" class="nav-item" aria-label="السلة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      السلة
    </a>

    <!-- Wishlist -->
    <a href="/wishlist" class="nav-item" aria-label="المفضلة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      المفضلة
    </a>

    <!-- Account -->
    <a href="/my-account" class="nav-item" aria-label="حسابي">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      حسابي
    </a>

  </nav>

  <script>
    function retryConnection() {
      var btn = document.getElementById('retryBtn');
      var icon = document.getElementById('retryIcon');
      btn.classList.add('loading');
      icon.classList.add('spin');

      // Try to fetch a small resource to check connectivity
      fetch('/api/push/count', { cache: 'no-store', method: 'HEAD' })
        .then(function(res) {
          if (res.ok) {
            // Back online — reload the original page
            window.location.reload();
          } else {
            resetBtn();
          }
        })
        .catch(function() {
          resetBtn();
        });
    }

    function resetBtn() {
      var btn = document.getElementById('retryBtn');
      var icon = document.getElementById('retryIcon');
      btn.classList.remove('loading');
      icon.classList.remove('spin');
    }

    // Auto-detect when connection is restored
    window.addEventListener('online', function() {
      window.location.reload();
    });

    // Apply saved language direction
    try {
      var lang = localStorage.getItem('dh_lang');
      if (lang && lang !== 'ar') {
        document.documentElement.lang = lang;
        document.documentElement.dir = 'ltr';
        document.querySelector('.bottom-nav').dir = 'ltr';
      }
    } catch(e) {}
  </script>
</body>
</html>
